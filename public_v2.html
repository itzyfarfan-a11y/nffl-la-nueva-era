<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFFL — La Nueva Era</title><style>
:root{--bg:#08070c;--card:#14121d;--line:#29243a;--p:#8d3cff;--g:#f2c94c;--txt:#f5f2fb;--muted:#aaa3b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#201133 0,#08070c 48%);font-family:Arial,sans-serif;color:var(--txt)}header{padding:22px 16px 14px;text-align:center;position:sticky;top:0;background:#08070ceF;backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid var(--line)}h1{margin:0;font-size:26px;letter-spacing:2px}h1 b{color:var(--g)}header small{color:var(--muted)}main{max-width:1000px;margin:auto;padding:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}select,button{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700}button{background:linear-gradient(135deg,#7b2cff,#b44cff);border:0;cursor:pointer}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:12px 0}.nav button{font-size:12px;background:#181522;border:1px solid var(--line)}.nav button.active{outline:2px solid var(--g);color:var(--g)}section{display:none}.card{background:#11101aE8;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.team{display:flex;align-items:center;gap:10px}.team img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#222}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#24183b;color:#d9c3ff;font-size:11px}.match{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center;gap:8px;text-align:center}.score{font-size:20px;font-weight:900;color:var(--g)}.player{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.player img{width:42px;height:42px;border-radius:50%;object-fit:cover}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:650px){.controls,.nav{grid-template-columns:1fr 1fr}.nav button{min-height:42px}.match{grid-template-columns:1fr 50px 1fr;font-size:12px}}
</style></head><body><header><h1>NFFL <b>LA NUEVA ERA</b></h1><small>Calendario · Resultados · Equipos · Playoffs</small></header><main>
<div class="controls"><select id="t"><option value="">Cargando torneos...</option></select><select id="c"><option value="">Todas las categorías</option></select></div><div id="status" class="card muted" style="display:none"></div><div class="nav" id="nav"></div>
<section id="inicio"></section><section id="equipos"></section><section id="jugadores"></section><section id="calendario"></section><section id="resultados"></section><section id="tabla"></section><section id="playoffs"></section>
</main><script>
const URL='https://picivrqgmckrwutarhyw.supabase.co';function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const KEY='sb_publishable_SK8XBpzn3b5Dr-qa2rO7Nw_un7KbvCl';
const headers={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const t=document.getElementById('t'), c=document.getElementById('c'), status=document.getElementById('status'), nav=document.getElementById('nav');
const sections={
  inicio:document.getElementById('inicio'), equipos:document.getElementById('equipos'),
  jugadores:document.getElementById('jugadores'), calendario:document.getElementById('calendario'),
  resultados:document.getElementById('resultados'), tabla:document.getElementById('tabla'),
  playoffs:document.getElementById('playoffs')
};
let data={tournament:{},categories:[],teams:[],matches:[],playoffs:[]};let tab='inicio';
async function rpc(name,body={}){let r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{let ts=await rpc('public_list_tournaments');if(!ts.length){t.innerHTML='<option value="">Sin torneos publicados</option>';showStatus('Aún no hay torneos publicados. Cuando el administrador publique uno, aparecerá aquí automáticamente.');render();return}t.innerHTML=ts.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.season?' · '+esc(x.season):''}</option>`).join('');await refresh()}catch(e){showStatus('No se pudo cargar NFFL. Revisa la conexión o las funciones públicas de Supabase.');console.error(e);render()}}
function showStatus(msg){status.textContent=msg;status.style.display='block'}
window.onerror=function(msg,src,line,col){showStatus('Error de la página: '+msg);console.error(msg,src,line,col)};
async function refresh(){if(!t.value){render();return}try{data=await rpc('public_get_tournament_data',{p_tournament_id:t.value,p_category_id:c.value||null});status.style.display='none';if(!data||typeof data!=='object'){throw Error('Respuesta inválida del servidor')}
if(!Array.isArray(data.categories)||!Array.isArray(data.teams)||!Array.isArray(data.matches)||!Array.isArray(data.playoffs)){
  throw Error('La respuesta del torneo no tiene el formato esperado')
}c.innerHTML='<option value="">Todas las categorías</option>'+data.categories.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');if(data.categories.some(x=>x.id===c.dataset.keep))c.value=c.dataset.keep;render()}catch(e){showStatus('No se pudo cargar la información del torneo.');console.error(e)}}
function team(id){return (data.teams||[]).find(x=>x.id===id)||{name:'Por definir'}}function render(){let navs=[['inicio','Inicio'],['equipos','Equipos'],['jugadores','Jugadores'],['calendario','Calendario'],['resultados','Resultados'],['tabla','Tabla'],['playoffs','Playoffs']];nav.innerHTML=navs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');document.querySelectorAll('section').forEach(s=>s.style.display='none');let s=sections[tab];if(!s)throw Error('Sección no encontrada: '+tab);s.style.display='block';let cat=c.value?data.categories.find(x=>x.id===c.value):null;
if(tab==='inicio')s.innerHTML=`<div class="card"><h2>${esc(data.tournament?.name||'NFFL')}</h2><p class="muted">${esc(cat?cat.name:'Selecciona una categoría para consultar su información.')}</p><div class="grid"><div class="card"><b>${(data.teams||[]).length}</b><br><span class="muted">Equipos</span></div><div class="card"><b>${(data.matches||[]).filter(x=>x.status==='jugado'||x.status==='incomparecencia').length}</b><br><span class="muted">Juegos registrados</span></div><div class="card"><b>${(data.playoffs||[]).length}</b><br><span class="muted">Partidos de playoffs</span></div></div></div>`;
if(tab==='equipos')s.innerHTML='<h2>Equipos</h2>'+(!data.teams.length?'<div class="empty">No hay equipos publicados para esta selección.</div>':'<div class="grid">')+data.teams.map(x=>`<div class="card team">${x.logo_url?`<img src="${esc(x.logo_url)}">`:'<div class="team img"></div>'}<div><b>${esc(x.name)}</b></div></div>`).join('')+(data.teams.length?' </div>':'' );
if(tab==='jugadores')loadPlayers(s);
if(tab==='calendario')s.innerHTML='<h2>Calendario</h2>'+data.matches.map(m=>`<div class="card"><span class="badge">Jornada ${esc(m.round_number)}</span><div class="match"><div>${esc(team(m.home_team_id).name)}</div><div class="score">${m.home_score??'—'}<br><small>VS</small><br>${m.away_score??'—'}</div><div>${esc(team(m.away_team_id).name)}</div></div><div class="muted" style="text-align:center">${esc(m.match_date||'Fecha por definir')} · ${esc(m.match_time?m.match_time.slice(0,5):'Hora por definir')} · ${esc(m.field_name||'Campo por definir')}</div></div>`).join('')||'<div class="empty">No hay calendario publicado.</div>';
if(tab==='resultados')s.innerHTML='<h2>Resultados</h2>'+data.matches.filter(m=>m.status==='jugado'||m.status==='incomparecencia').map(m=>`<div class="card"><div class="match"><b>${esc(team(m.home_team_id).name)}</b><div class="score">${m.home_score}-${m.away_score}</div><b>${esc(team(m.away_team_id).name)}</b></div><div class="muted" style="text-align:center">Jornada ${m.round_number}${m.status==='incomparecencia'?' · Incomparecencia':''}</div></div>`).join('')||'<div class="empty">Aún no hay resultados publicados.</div>';
if(tab==='tabla')renderTable(s);
if(tab==='playoffs')s.innerHTML='<h2>Playoffs</h2>'+data.playoffs.map(p=>`<div class="card"><span class="badge">${esc(p.stage)}</span><div class="match"><b>${esc(p.team_a_id?team(p.team_a_id).name:'Por definir')}</b><div class="score">${p.score_a??'—'}<br>VS<br>${p.score_b??'—'}</div><b>${esc(p.team_b_id?team(p.team_b_id).name:'Por definir')}</b></div></div>`).join('')||'<div class="empty">El bracket aún no ha sido publicado.</div>';
}
async function loadPlayers(s){if(!c.value){s.innerHTML='<div class="empty">Selecciona una categoría para consultar los rosters aprobados.</div>';return}let html='<h2>Jugadores</h2>';for(const tm of data.teams){let p=await rpc('public_get_roster',{p_tournament_id:t.value,p_category_id:c.value,p_team_id:tm.id});if(p.length)html+=`<div class="card"><h3>${esc(tm.name)}</h3>${p.map(x=>`<div class="player"><img src="${esc(x.photo_url)}"><div><b>#${esc(x.jersey_number)} ${esc(x.full_name)}</b></div></div>`).join('')}</div>`}s.innerHTML=html||'<div class="empty">No hay rosters aprobados para esta categoría.</div>'}
function renderTable(s){
if(!c.value){s.innerHTML='<h2>Tabla de posiciones</h2><div class="empty">Selecciona una categoría para consultar su tabla.</div>';return}
let map={};for(const m of data.matches){if(m.status!=='jugado'&&m.status!=='incomparecencia')continue;const excluded=m.stats_exclude_team_id||null;for(const id of [m.home_team_id,m.away_team_id])if(!map[id])map[id]={id,pj:0,pg:0,pp:0,pf:0,pc:0};let h=map[m.home_team_id],a=map[m.away_team_id],hs=m.home_score||0,as=m.away_score||0;if(m.home_team_id!==excluded){h.pj++;h.pf+=hs;h.pc+=as;if(hs>as)h.pg++;else if(as>hs)h.pp++}if(m.away_team_id!==excluded){a.pj++;a.pf+=as;a.pc+=hs;if(as>hs)a.pg++;else if(hs>as)a.pp++}}
let rows=Object.values(map).map(x=>({...x,dif:x.pf-x.pc})).filter(x=>x.pj>0).sort((x,y)=>y.dif-x.dif||y.pf-x.pf||x.pc-y.pc||team(x.id).name.localeCompare(team(y.id).name));s.innerHTML='<h2>Tabla de posiciones</h2><div class="card"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PP</th><th>PA</th><th>PC</th><th>DIF</th></tr></thead><tbody>'+rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${team(x.id).name}</b></td><td>${x.pj}</td><td>${x.pg}</td><td>${x.pp}</td><td>${x.pf}</td><td>${x.pc}</td><td>${x.dif}</td></tr>`).join('')+'</tbody></table></div>'}
t.onchange=()=>{c.dataset.keep='';refresh()};c.onchange=()=>{c.dataset.keep=c.value;refresh()};load();
</script></body></html>
