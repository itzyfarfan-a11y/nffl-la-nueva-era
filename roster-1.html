<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFFL — Registro de Roster</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08070c;--p:#17131f;--line:#3b3148;--purple:#8127ff;--gold:#e6c04d;--red:#6b2231;--green:#50d890}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32105b,#08070c 55%);color:#fff;font-family:Arial,sans-serif}.app{max-width:620px;margin:auto;padding:20px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}h1{font-size:32px;margin:4px 0 18px}h2{margin:0 0 10px;font-size:25px}.team{font-size:28px;font-weight:900;margin:8px 0 12px}.mut{color:#aaa4b7}.notice{padding:12px;border-left:3px solid var(--gold);background:#211b2b;border-radius:8px}.count{font-size:18px;font-weight:900;margin:12px 0}.roster-list{display:grid;gap:8px}.roster-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#0f0d15;cursor:pointer}.roster-item:active{transform:scale(.99)}.roster-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}.roster-meta{min-width:0;flex:1}.roster-meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}.player{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:#110e17}.player-title{font-size:20px;font-weight:900;margin-bottom:8px}.player-sub{font-size:13px;color:#aaa4b7;margin-bottom:8px}input{width:100%;padding:13px;margin:6px 0;background:#0c0b11;color:#fff;border:1px solid var(--line);border-radius:9px;font-size:16px}input[type=file]{background:#0c0b11;padding:10px}button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--purple);color:#fff;font-weight:900;font-size:16px;margin-top:8px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.gold{background:var(--gold);color:#15110a}.del{background:var(--red)}.secondary{background:#2a2432}.preview{display:block;width:180px;height:180px;margin:10px auto;border-radius:12px;border:1px solid var(--line);object-fit:cover}.msg{min-height:24px;margin-top:12px;font-weight:700}.empty{padding:10px 0;color:#aaa4b7}.footer{height:20px}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <h1>🏈 NFFL — LA NUEVA ERA</h1>
    <h2 id="title">Registro de Roster</h2>
    <div id="teamName" class="team"></div>
    <p class="mut">Puedes modificar este roster todas las veces que necesites antes del inicio del torneo.</p>
    <div class="notice">Foto, nombre y número son obligatorios. CURP solo en Mom’s y +35.</div>
  </div>

  <div id="appCard" class="card">
    <h3>📋 Jugadores capturados</h3>
    <div id="rosterList" class="roster-list"></div>
    <div id="players"></div>
    <button id="addBtn" type="button">+ AGREGAR JUGADOR</button>
    <button id="saveBtn" type="button" class="gold">GUARDAR ROSTER</button>
    <div id="msg" class="msg"></div>
  </div>
  <div class="footer"></div>
</div>

<script>
(function(){
'use strict';
const SUPABASE_URL='https://picivrqgmckrwutarhyw.supabase.co';
const KEY='sb_publishable_SK8XBpzn3b5Dr-qa2rO7Nw_un7KbvCl';
const token=new URLSearchParams(window.location.search).get('token');
let sb=null;
let rows=[];
let busy=false;

function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'local-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function setMsg(text,ok){$('msg').innerHTML=text?'<span style="color:'+(ok?'#50d890':'#ff6378')+'">'+esc(text)+'</span>':''}

function initClient(){
  try{ if(window.supabase) sb=window.supabase.createClient(SUPABASE_URL,KEY); }catch(e){ sb=null; }
}

function isCaptured(p){
  const name=(p.full_name||'').trim();
  const num=p.jersey_number;
  return !!name && num!==null && num!==undefined && num!=='' && !!p.photo_url;
}

function syncVisibleForms(){
  rows.forEach(p=>{
    const n=$('n_'+p.id),j=$('j_'+p.id),c=$('c_'+p.id),img=$('pv_'+p.id),file=$('f_'+p.id);
    if(n) p.full_name=n.value.trim();
    if(j) p.jersey_number=j.value===''?null:Number(j.value);
    if(c) p.curp=c.value.trim()||null;
    if(img && img.src && img.style.display!=='none') p.photo_url=img.src;
    if(file && file.files && file.files[0]) p._file=file.files[0];
  });
}

function capturedHtml(){
  const captured=rows.filter(isCaptured);
  if(!captured.length) return '<div class="empty">Todavía no hay jugadores capturados.</div>';
  return '<div class="count">'+captured.length+' de 18 jugadores en el roster</div>'+captured.map(p=>
    '<div class="roster-item" data-edit="'+esc(p.id)+'" tabindex="0" role="button">'+
      (p.photo_url?'<img class="roster-thumb" src="'+esc(p.photo_url)+'" alt="Foto">':'')+
      '<div class="roster-meta"><b>'+esc(p.full_name)+'</b><span class="mut">Jersey #'+esc(p.jersey_number)+'</span><span class="mut">Toca para modificar</span></div>'+
    '</div>'
  ).join('');
}

function formHtml(p,index){
  const label=isCaptured(p)?p.full_name:('Nuevo jugador '+index);
  return '<div class="player" id="player_'+esc(p.id)+'">'+
    '<div class="player-title">'+esc(label)+'</div>'+
    '<div class="player-sub">'+(isCaptured(p)?'Puedes modificar sus datos.':'Completa nombre, número y foto.')+'</div>'+
    '<input id="n_'+esc(p.id)+'" value="'+esc(p.full_name||'')+'" placeholder="Nombre completo *" autocomplete="off">'+
    '<input id="j_'+esc(p.id)+'" value="'+esc(p.jersey_number??'')+'" type="number" min="0" placeholder="Número de jersey *">'+
    '<input id="c_'+esc(p.id)+'" value="'+esc(p.curp||'')+'" placeholder="CURP (solo Mom’s/+35)" autocomplete="off">'+
    '<input id="f_'+esc(p.id)+'" type="file" accept="image/*">'+
    '<img id="pv_'+esc(p.id)+'" class="preview" '+(p.photo_url?'src="'+esc(p.photo_url)+'"':'style="display:none"')+' alt="Vista previa">'+
    '<button type="button" class="secondary" data-toggle="'+esc(p.id)+'">'+(isCaptured(p)?'Ocultar':'Guardar datos por ahora')+'</button>'+
    '<button type="button" class="del" data-delete="'+esc(p.id)+'">Eliminar</button>'+
  '</div>';
}

function render(){
  syncVisibleForms();
  const captured=rows.filter(isCaptured);
  const open=rows.filter(p=>p.expanded);
  $('rosterList').innerHTML=capturedHtml();
  $('players').innerHTML=open.map((p,i)=>formHtml(p,i+1)).join('');
  bind();
}

function bind(){
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>{
    syncVisibleForms(); const p=rows.find(x=>x.id===el.dataset.edit); if(!p)return; p.expanded=true; render(); setTimeout(()=>{$('player_'+p.id)?.scrollIntoView({behavior:'smooth',block:'center'})},50);
  }));
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}));
  document.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    syncVisibleForms(); const p=rows.find(x=>x.id===el.dataset.toggle); if(!p)return; p.expanded=false; render();
  }));
  document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{
    syncVisibleForms(); const p=rows.find(x=>x.id===el.dataset.delete); if(!p)return; if(!confirm('¿Eliminar a '+(p.full_name||'este jugador')+'?'))return; rows=rows.filter(x=>x.id!==p.id); render();
  }));
  rows.forEach(p=>{
    const n=$('n_'+p.id),j=$('j_'+p.id),c=$('c_'+p.id),f=$('f_'+p.id);
    [n,j,c].forEach(el=>{if(el)el.addEventListener('input',()=>{syncVisibleForms();updateListOnly()})});
    if(f)f.addEventListener('change',()=>previewFile(p.id));
  });
}

function updateListOnly(){ $('rosterList').innerHTML=capturedHtml(); bindListOnly(); }
function bindListOnly(){
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>{syncVisibleForms();const p=rows.find(x=>x.id===el.dataset.edit);if(p){p.expanded=true;render();setTimeout(()=>{$('player_'+p.id)?.scrollIntoView({behavior:'smooth',block:'center'})},50)}}));
}

function previewFile(id){
  const f=$('f_'+id),img=$('pv_'+id),p=rows.find(x=>x.id===id); if(!f||!p)return;
  const file=f.files&&f.files[0]; if(!file)return;
  const reader=new FileReader(); reader.onload=e=>{p.photo_url=e.target.result;p._file=file;img.src=e.target.result;img.style.display='block';syncVisibleForms();updateListOnly()}; reader.readAsDataURL(file);
}

function addPlayer(){
  syncVisibleForms();
  if(rows.length>=18){setMsg('El roster ya tiene el máximo de 18 jugadores.');return;}
  rows.forEach(p=>{ if(!isCaptured(p)) p.expanded=true; });
  rows.push({id:uid(),player_id:null,full_name:'',jersey_number:null,curp:null,photo_url:'',expanded:true});
  setMsg(''); render();
  setTimeout(()=>document.getElementById('players').lastElementChild?.scrollIntoView({behavior:'smooth',block:'center'}),50);
}

async function fileData(file){
  if(!file)return '';
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const max=900;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.78));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function reloadFromServer(){
  if(!sb||!token)return;
  const {data,error}=await sb.rpc('get_roster_with_access_link',{p_token:token});
  if(error)throw error;
  $('title').textContent='Roster · '+(data.category||'');
  $('teamName').textContent=data.team_name||data.team||'';
  rows=(data.players||[]).map(p=>({...p,id:p.player_id,player_id:p.player_id,expanded:false}));
  render();
}

async function save(){
  if(busy)return;
  busy=true;$('saveBtn').disabled=true;$('addBtn').disabled=true;setMsg('Guardando roster…');
  try{
    syncVisibleForms();
    if(!sb)throw new Error('No se pudo conectar con NFFL. Recarga la página.');
    if(!token)throw new Error('Enlace inválido.');
    if(!rows.length)throw new Error('Agrega al menos un jugador.');
    if(rows.length>18)throw new Error('El roster no puede tener más de 18 jugadores.');
    const players=[];
    const jerseySet=new Set();
    for(const p of rows){
      const name=(p.full_name||'').trim(),num=p.jersey_number,file=p._file;
      if(!name||num===null||num===undefined||num===''||!p.photo_url){throw new Error('Completa nombre, número y foto de cada jugador.');}
      const jersey=Number(num);
      if(!Number.isInteger(jersey)||jersey<0)throw new Error('El número de jersey debe ser un número válido.');
      if(jerseySet.has(jersey))throw new Error('No puede haber números de jersey duplicados dentro del mismo roster. Revisa el #'+jersey+'.');
      jerseySet.add(jersey);
      players.push({player_id:p.player_id||null,full_name:name,jersey_number:jersey,curp:(p.curp||'').trim()||null,photo_url:file?await fileData(file):p.photo_url});
    }
    const {data,error}=await sb.rpc('submit_roster_with_access_link',{p_token:token,p_players:players});
    if(error)throw error;
    const saved=Number(data?.players_saved ?? data?.count ?? 0);
    if(saved<=0) throw new Error('El servidor no confirmó jugadores guardados. No se aplicaron cambios.');
    await reloadFromServer();
    setMsg('Roster guardado correctamente: '+saved+' jugador'+(saved===1?'':'es')+' guardado'+(saved===1?'':'s')+'.',true);
  }catch(e){setMsg(e.message||'No se pudo guardar el roster.');}
  finally{busy=false;$('saveBtn').disabled=false;$('addBtn').disabled=false;}
}

async function init(){
  initClient();
  $('addBtn').addEventListener('click',addPlayer);
  $('saveBtn').addEventListener('click',save);
  if(!sb){setMsg('No se pudo cargar el sistema. Verifica tu conexión e inténtalo de nuevo.');return;}
  if(!token){setMsg('Enlace inválido.');return;}
  try{await reloadFromServer();if(!rows.length){rows=[{id:uid(),player_id:null,full_name:'',jersey_number:null,curp:null,photo_url:'',expanded:true}];render();}}catch(e){$('appCard').innerHTML='<p style="color:#ff6378">'+esc(e.message||'Enlace inválido o cerrado.')+'</p>';}
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
