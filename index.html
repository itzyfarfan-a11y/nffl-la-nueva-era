<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFFL — La Nueva Era</title><style>
:root{--bg:#08070c;--card:#14121d;--line:#29243a;--p:#8d3cff;--g:#f2c94c;--txt:#f5f2fb;--muted:#aaa3b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#201133 0,#08070c 48%);font-family:Arial,sans-serif;color:var(--txt)}header{padding:16px 14px 10px;text-align:center;position:sticky;top:0;background:#08070cf5;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px;letter-spacing:1.5px;line-height:1.1}h1 b{color:var(--g)}header small{display:block;color:var(--muted);font-size:13px;margin-top:6px}main{max-width:1000px;margin:auto;padding:12px}.selection-hint{font-size:11px;color:var(--muted);margin:0 2px 6px;letter-spacing:.2px}.controls{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px;margin-bottom:10px}select,button{width:100%;min-width:0;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{background:linear-gradient(135deg,#7b2cff,#b44cff);border:0;cursor:pointer}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:8px 0 12px;padding:2px 1px}.nav button{width:100%;min-width:0;font-size:12px;padding:10px 8px;background:#181522;border:1px solid var(--line);white-space:nowrap}.nav button.active{outline:2px solid var(--g);color:var(--g);background:#21182d}section{display:none}.card{background:#11101aeF;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.card h2{margin:3px 0 10px;font-size:24px}.card h3{margin:2px 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.grid .card{margin:0;padding:12px}.team{display:flex;align-items:center;gap:9px}.team img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#222}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#24183b;color:#d9c3ff;font-size:10px}.match{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;gap:7px;text-align:center}.score{font-size:19px;font-weight:900;color:var(--g)}.player{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}.player img{width:40px;height:40px;border-radius:50%;object-fit:cover}.empty{padding:26px;text-align:center;color:var(--muted)}.loading{padding:22px;text-align:center;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.count{font-size:11px;color:var(--muted);font-weight:700}@media(max-width:650px){header{padding-top:13px}h1{font-size:22px}.controls{gap:7px}select{font-size:13px;padding:10px;min-width:0}.nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.nav button{min-height:40px}.match{grid-template-columns:1fr 48px 1fr;font-size:12px}.card h2{font-size:22px}}

.admin-btn{width:auto;display:inline-block;margin-top:10px;padding:8px 14px;border-radius:999px;background:#181522;border:1px solid var(--g);color:var(--g);font-size:12px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:rgba(4,3,8,.82);backdrop-filter:blur(8px);z-index:20;padding:20px;align-items:center;justify-content:center}
.modal.open{display:flex}.login-card{position:relative;width:min(440px,100%);background:#14121d;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.login-card h2{margin:0 0 8px;font-size:25px}.login-icon{font-size:32px;margin-bottom:6px}.login-card label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px;color:var(--muted)}
.login-card input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#09080d;color:var(--txt);font-size:15px;outline:none}.login-card input:focus{border-color:var(--g)}
.login-btn{margin-top:16px;background:linear-gradient(135deg,#7b2cff,#b44cff);color:#fff;border:0;padding:13px;border-radius:12px;font-weight:900}
.close-btn{position:absolute;right:12px;top:10px;width:auto;padding:2px 9px;background:transparent;border:0;color:var(--muted);font-size:28px}.login-msg{min-height:20px;margin-top:10px;font-size:12px;color:var(--muted)}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><h1>NFFL <b>LA NUEVA ERA</b></h1><small>Calendario · Resultados · Equipos · Playoffs</small><button id="adminBtn" class="admin-btn" type="button">🔐 Administrador</button></header>
<div id="adminModal" class="modal" aria-hidden="true">
  <div class="login-card">
    <button id="adminBtn" class="admin-btn" type="button" onclick="document.getElementById('adminModal').classList.add('open');document.getElementById('adminModal').setAttribute('aria-hidden','false');">🔐 Administrador</button>
