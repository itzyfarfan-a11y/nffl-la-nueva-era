<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFFL — La Nueva Era</title>
<style>
:root{--bg:#08070c;--card:#14121d;--line:#29243a;--p:#8d3cff;--g:#f2c94c;--txt:#f5f2fb;--muted:#aaa3b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#201133 0,#08070c 48%);font-family:Arial,sans-serif;color:var(--txt)}
header{padding:16px 14px 10px;text-align:center;position:sticky;top:0;background:#08070cf5;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;letter-spacing:1.5px}h1 b{color:var(--g)}header small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.admin-btn{display:inline-block;margin-top:10px;padding:9px 16px;border-radius:999px;background:#181522;border:1px solid var(--g);color:var(--g);font-size:12px;font-weight:800;text-decoration:none}
main{max-width:1100px;margin:auto;padding:12px}.selection-hint{font-size:11px;color:var(--muted);margin:0 2px 6px}
.controls{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px;margin-bottom:10px}
select,button{width:100%;min-width:0;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700;font-size:13px}button{cursor:pointer}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:8px 0 12px}.nav button{font-size:12px;padding:10px 8px;background:#181522;border:1px solid var(--line)}.nav button.active{outline:2px solid var(--g);color:var(--g);background:#21182d}
section{display:none}.card{background:#11101aeF;border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.card h2{margin:3px 0 10px;font-size:24px}.card h3{margin:2px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.grid .card{margin:0;padding:12px}.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#24183b;color:#d9c3ff;font-size:10px}.match{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;gap:7px;text-align:center}.score{font-size:19px;font-weight:900;color:var(--g)}
.player{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}.player img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.empty,.loading{padding:26px;text-align:center;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.count{font-size:11px;color:var(--muted);font-weight:700}
.cg-scroll,.team-matchups{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}.calendar-grid{min-width:900px;background:#11101a}.calendar-grid th,.calendar-grid td{border:1px solid var(--line);padding:6px;vertical-align:top}.calendar-grid thead th{background:#181522;color:var(--g);font-weight:900;white-space:nowrap}.calendar-grid .cg-time{width:72px;background:#181522;color:var(--g);white-space:nowrap}.cg-day td{background:#21182d!important;text-align:left!important;font-weight:900;font-size:14px;padding:10px}
.cg-game{min-width:170px;border-radius:10px;padding:8px;background:#171522}.cg-game.cg-mixto{border-left:4px solid #8fd14f}.cg-game.cg-bronce{border-left:4px solid #f39a3d}.cg-game.cg-silverf{border-left:4px solid #ffb4b8}.cg-game.cg-silverv{border-left:4px solid #76c7df}.cg-game.cg-35{border-left:4px solid #fff}.cg-game.cg-golden{border-left:4px solid var(--g)}.cg-cat{font-size:10px;color:var(--muted);font-weight:800;margin-bottom:5px}.cg-teams{font-weight:900;font-size:12px;line-height:1.25}.cg-teams span{color:var(--muted);font-weight:700}.cg-meta{font-size:10px;color:var(--muted);margin-top:5px}.cg-empty{min-height:82px;display:flex;align-items:center;justify-content:center;color:#5f596d}
.team-matchups table{min-width:900px}.team-matchups th{background:#181522;color:var(--g);white-space:nowrap}.team-matchups td:first-child,.team-matchups th:first-child{text-align:left}.team-name,.round-opponent{font-weight:800;white-space:nowrap}.round-empty{color:var(--muted)}
@media(max-width:650px){h1{font-size:22px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.match{grid-template-columns:1fr 48px 1fr;font-size:12px}.card h2{font-size:22px}}
</style>
</head>
<body>
<header><h1>NFFL <b>LA NUEVA ERA</b></h1><small>Calendario · Enfrentamientos · Resultados · Equipos · Playoffs</small><a class="admin-btn" href="./admin.html">🔐 Administrador</a></header>
<main>
<div class="selection-hint">Selecciona torneo y categoría</div>
<div class="controls"><select id="t"><option value="">Cargando torneos...</option></select><select id="c"><option value="">Todas las categorías</option></select></div>
<div id="status" class="card muted" style="display:none"></div><div class="nav" id="nav"></div>
<section id="inicio"></section><section id="equipos"></section><section id="jugadores"></section><section id="calendario"></section><section id="resultados"></section><section id="tabla"></section><section id="playoffs"></section>
</main>
<footer style="text-align:center;padding:20px 12px 28px;color:var(--muted);font-size:11px">NFFL LA NUEVA ERA · Portal público</footer>
<script>
const SUPABASE_URL='https://picivrqgmckrwutarhyw.supabase.co';
const SUPABASE_KEY='sb_publishable_SK8XBpzn3b5Dr-qa2rO7Nw_un7KbvCl';
const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
const t=document.getElementById('t'),c=document.getElementById('c'),status=document.getElementById('status'),nav=document.getElementById('nav');
const sections={inicio:inicio,equipos:equipos,jugadores:jugadores,calendario:calendario,resultados:resultados,tabla:tabla,playoffs:playoffs};
let data={tournament:{},categories:[],teams:[],matches:[],playoffs:[]},tab='inicio';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function rpc(name,body={}){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function team(id){return data.teams.find(x=>x.id===id)||{name:'Por definir'}}
function catName(id){return data.categories.find(x=>x.id===id)?.name||'Categoría'}
function showStatus(x){status.textContent=x;status.style.display='block'}
async function load(){
 try{const ts=await rpc('public_list_tournaments');if(!ts.length){t.innerHTML='<option>Sin torneos publicados</option>';showStatus('Aún no hay torneos publicados.');render();return}
 t.innerHTML=ts.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');await refresh()}catch(e){console.error(e);showStatus('No se pudo cargar NFFL. Revisa la conexión.');render()}}
async function refresh(){
 if(!t.value)return;
 try{data=await rpc('public_get_tournament_data',{p_tournament_id:t.value,p_category_id:c.value||null});
 c.innerHTML='<option value="">Todas las categorías</option>'+data.categories.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
 status.style.display='none';render()}catch(e){console.error(e);showStatus('No se pudo cargar la información del torneo.')}}
function render(){
 const navs=[['inicio','🏠 Inicio'],['equipos','👥 Equipos'],['jugadores','🧑 Jugadores'],['calendario','📅 Calendario'],['resultados','🏈 Resultados'],['tabla','📊 Tabla'],['playoffs','🏆 Playoffs']];
 nav.innerHTML=navs.map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');
 document.querySelectorAll('section').forEach(s=>s.style.display='none');const s=sections[tab];s.style.display='block';const cat=c.value?data.categories.find(x=>x.id===c.value):null;
 if(tab==='inicio')s.innerHTML=`<div class="card"><h2>${esc(data.tournament?.name||'NFFL')}</h2><p class="muted">${esc(data.tournament?.season||'')}${cat?' · '+esc(cat.name):''}</p><div class="grid"><div class="card"><b>${data.teams.length}</b><br><span class="muted">Equipos</span></div><div class="card"><b>${data.matches.filter(x=>x.status==='jugado'||x.status==='incomparecencia').length}</b><br><span class="muted">Juegos registrados</span></div><div class="card"><b>${data.playoffs.length}</b><br><span class="muted">Partidos de playoffs</span></div></div></div>`;
 if(tab==='equipos')s.innerHTML='<h2>Equipos</h2>'+(!data.teams.length?'<div class="empty">No hay equipos publicados.</div>':'<div class="grid">'+data.teams.map(x=>`<div class="card"><b>${esc(x.name)}</b></div>`).join('')+'</div>');
 if(tab==='jugadores')loadPlayers(s);
 if(tab==='calendario')renderCalendar(s);
 if(tab==='resultados')renderResults(s);
 if(tab==='tabla')renderTable(s);
 if(tab==='playoffs')renderPlayoffs(s);
}
function fieldNo(v){const m=String(v||'').match(/(?:campo|cancha)\s*(\d+)/i);return m?Number(m[1]):99}
function catClass(n){const x=String(n||'').toLowerCase();if(x.includes('mixto'))return'cg-mixto';if(x.includes('bronce'))return'cg-bronce';if(x.includes('silver femenil'))return'cg-silverf';if(x.includes('silver varonil'))return'cg-silverv';if(x.includes('35'))return'cg-35';if(x.includes('golden'))return'cg-golden';return'cg-other'}
function renderCalendar(s){
 const items=data.matches.map(m=>({...m,kind:'regular'})).concat(data.playoffs.map(p=>({...p,kind:'playoff'}))).sort((a,b)=>String(a.match_date||'9999').localeCompare(String(b.match_date||'9999'))||String(a.match_time||'99').localeCompare(String(b.match_time||'99'))||fieldNo(a.field_name)-fieldNo(b.field_name));
 const groups={};items.forEach(m=>(groups[m.match_date||'SIN FECHA']??=[]).push(m));let html='<div class="section-title"><h2>Calendario General</h2><span class="count">'+items.length+' partidos</span></div>';
 for(const day of Object.keys(groups).sort()){
  html+=`<div class="card"><h3>📅 ${esc(day)}</h3><div class="cg-scroll"><table class="calendar-grid"><thead><tr><th>HORARIO</th><th>CAMPO 1</th><th>CAMPO 2</th><th>CAMPO 3</th><th>CAMPO 4</th></tr></thead><tbody>`;
  const times=[...new Set(groups[day].map(m=>m.match_time?String(m.match_time).slice(0,5):'SIN HORA'))].sort();
  for(const tm of times){html+=`<tr><th class="cg-time">${esc(tm==='SIN HORA'?'Pendiente':tm)}</th>`;for(let f=1;f<=4;f++){const m=groups[day].find(x=>fieldNo(x.field_name)===f&&(x.match_time?String(x.match_time).slice(0,5):'SIN HORA')===tm);html+='<td>'+cell(m)+'</td>'}html+='</tr>'}html+='</tbody></table></div></div>';
 }
 html+=matchupView();
 s.innerHTML=html;
}
function cell(m){if(!m)return'<div class="cg-empty">—</div>';const po=m.kind==='playoff',cn=po?(m.stage||'Playoff'):catName(m.category_id),a=po?team(m.team_a_id).name:team(m.home_team_id).name,b=po?team(m.team_b_id).name:team(m.away_team_id).name;return `<div class="cg-game ${catClass(cn)}"><div class="cg-cat">${esc(cn)}${m.round_number?' · J'+esc(m.round_number):''}</div><div class="cg-teams">${esc(a)} <span>vs</span> ${esc(b)}</div><div class="cg-meta">${po?'🏆':'🏈'} ${esc(m.match_time?String(m.match_time).slice(0,5):'Hora por definir')} · ${esc(m.field_name||'Campo por definir')}</div></div>`}
function matchupView(){
 if(!c.value)return'<div class="card"><div class="empty">Selecciona una categoría para ver los enfrentamientos de cada equipo de J1 a J7.</div></div>';
 let h='<div class="card"><div class="section-title"><h2>Enfrentamientos por equipo</h2><span class="count">J1–J7</span></div><div class="team-matchups"><table><thead><tr><th>CATEGORÍA</th><th>EQUIPO</th><th>J1</th><th>J2</th><th>J3</th><th>J4</th><th>J5</th><th>J6</th><th>J7</th></tr></thead><tbody>';
 data.teams.forEach(tm=>{h+=`<tr><td>${esc(catName(c.value))}</td><td class="team-name">${esc(tm.name)}</td>`;for(let r=1;r<=7;r++){const m=data.matches.find(x=>x.category_id===c.value&&Number(x.round_number)===r&&(x.home_team_id===tm.id||x.away_team_id===tm.id));const opp=m?(m.home_team_id===tm.id?team(m.away_team_id).name:team(m.home_team_id).name):'—';h+=`<td class="${m?'round-opponent':'round-empty'}">${esc(opp)}</td>`}h+='</tr>'});return h+'</tbody></table></div><div class="muted" style="font-size:11px;margin-top:8px">Consulta rápida de rivales durante las siete jornadas.</div></div>'}
async function loadPlayers(s){if(!c.value){s.innerHTML='<div class="empty">Selecciona una categoría para consultar los rosters aprobados.</div>';return}s.innerHTML='<div class="loading">Cargando jugadores…</div>';try{let h='<div class="section-title"><h2>Jugadores</h2></div>',found=0;for(const tm of data.teams){const ps=await rpc('public_get_roster',{p_tournament_id:t.value,p_category_id:c.value,p_team_id:tm.id});if(ps.length){found+=ps.length;h+=`<div class="card"><h3>${esc(tm.name)}</h3>${ps.map(x=>`<div class="player">${x.photo_url?`<img src="${esc(x.photo_url)}">`:''}<div><b>#${esc(x.jersey_number)} ${esc(x.full_name)}</b></div></div>`).join('')}</div>`}}s.innerHTML=found?h:'<div class="empty">No hay rosters aprobados para esta categoría.</div>'}catch(e){console.error(e);s.innerHTML='<div class="empty">No se pudieron cargar los jugadores.</div>'}}
function renderResults(s){const a=data.matches.filter(m=>m.status==='jugado'||m.status==='incomparecencia');s.innerHTML='<h2>Resultados</h2>'+(!a.length?'<div class="empty">Aún no hay resultados publicados.</div>':a.map(m=>`<div class="card"><span class="badge">Jornada ${esc(m.round_number)}</span><div class="match"><b>${esc(team(m.home_team_id).name)}</b><div class="score">${m.home_score??0}-${m.away_score??0}</div><b>${esc(team(m.away_team_id).name)}</b></div><div class="muted" style="text-align:center">${esc(m.match_date||'')}</div></div>`).join(''))}
function renderTable(s){if(!c.value){s.innerHTML='<h2>Tabla de posiciones</h2><div class="empty">Selecciona una categoría para consultar su tabla.</div>';return}const map={};data.matches.filter(m=>m.status==='jugado'||m.status==='incomparecencia').forEach(m=>{for(const id of[m.home_team_id,m.away_team_id])map[id]??={id,pj:0,pg:0,pp:0,pf:0,pc:0};const h=map[m.home_team_id],a=map[m.away_team_id],hs=m.home_score||0,as=m.away_score||0;h.pj++;h.pf+=hs;h.pc+=as;a.pj++;a.pf+=as;a.pc+=hs;if(hs>as)h.pg++;else if(as>hs)a.pg++;if(as>hs)h.pp++;else if(hs>as)a.pp++});data.teams.forEach(tm=>map[tm.id]??={id:tm.id,pj:0,pg:0,pp:0,pf:0,pc:0});const rows=Object.values(map).map(x=>({...x,dif:x.pf-x.pc})).sort((a,b)=>b.dif-a.dif||b.pf-a.pf||a.pc-b.pc||team(a.id).name.localeCompare(team(b.id).name));s.innerHTML='<h2>Tabla de posiciones</h2><div class="card"><table><thead><tr><th>#</th><th>Equipo</th><th>JJ</th><th>JG</th><th>PP</th><th>PA</th><th>PC</th><th>DIF</th></tr></thead><tbody>'+rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(team(x.id).name)}</b></td><td>${x.pj}</td><td>${x.pg}</td><td>${x.pp}</td><td>${x.pf}</td><td>${x.pc}</td><td>${x.dif}</td></tr>`).join('')+'</tbody></table></div>'}
function renderPlayoffs(s){s.innerHTML='<h2>Playoffs</h2>'+(!data.playoffs.length?'<div class="empty">El bracket aún no ha sido publicado.</div>':data.playoffs.map(p=>`<div class="card"><span class="badge">${esc(p.stage||'Playoff')}</span><div class="match"><b>${esc(team(p.team_a_id).name)}</b><div class="score">${p.score_a??'—'}-${p.score_b??'—'}</div><b>${esc(team(p.team_b_id).name)}</b></div></div>`).join(''))}
t.onchange=()=>{c.value='';refresh()};c.onchange=refresh;load();
</script>
</body>
</html>
